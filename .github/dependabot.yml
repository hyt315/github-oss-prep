version: 2
updates:
  # 本仓库没有包清单文件（无 package.json / pyproject.toml / requirements.txt），
  # 因此只监控 GitHub Actions。声明不存在的生态会让 Dependabot 任务直接失败
  # （实测：npm_and_yarn 与 pip 两个 update 在 bec570b 上均为 failure）。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-dependencies:
        patterns:
          - "*"
